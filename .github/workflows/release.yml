name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # publish the Marketplace extension on demand

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @drafteine/core -w @drafteine/cli -w @drafteine/language-server
      - run: npm test
      - name: Pack npm tarballs
        run: |
          mkdir -p out
          npm pack -w @drafteine/core -w @drafteine/cli -w @drafteine/language-server --pack-destination out
      - name: Package extension
        run: |
          node build.mjs
          npx @vscode/vsce package --no-dependencies --out ../../out/
        working-directory: packages/vscode-extension
      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: out/*
          generate_release_notes: true
      - name: Publish extension to the Marketplace
        if: env.VSCE_PAT != ''
        run: npx @vscode/vsce publish --no-dependencies -p "$VSCE_PAT"
        working-directory: packages/vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
