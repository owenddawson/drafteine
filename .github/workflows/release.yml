name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # publish the Marketplace extension on demand

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @drafteine/core -w @drafteine/cli -w @drafteine/language-server
      - run: npm test
      - name: Pack npm tarballs
        run: |
          mkdir -p out
          npm pack -w @drafteine/core -w @drafteine/cli -w @drafteine/language-server --pack-destination out
      - name: Package extension
        run: |
          node build.mjs
          npx @vscode/vsce package --no-dependencies --out ../../out/
        working-directory: packages/vscode-extension
      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: out/*
          generate_release_notes: true
      - name: Publish extension to the Marketplace
        if: env.VSCE_PAT != ''
        run: |
          local_version=$(jq -r .version package.json)
          published=$(npx @vscode/vsce show drafteine.drafteine --json 2>/dev/null | jq -r '.versions[0].version' || echo none)
          if [ "$published" = "$local_version" ]; then
            echo "v$local_version is already on the Marketplace, skipping"
          else
            npx @vscode/vsce publish --no-dependencies -p "$VSCE_PAT"
          fi
        working-directory: packages/vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish extension to Open VSX
        if: env.OVSX_PAT != ''
        run: |
          local_version=$(jq -r .version packages/vscode-extension/package.json)
          published=$(curl -s https://open-vsx.org/api/drafteine/drafteine | jq -r '.version // "none"')
          if [ "$published" = "$local_version" ]; then
            echo "v$local_version is already on Open VSX, skipping"
          else
            npx ovsx publish out/*.vsix -p "$OVSX_PAT"
          fi
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
