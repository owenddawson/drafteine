name: Feature request
description: Propose an addition to the language or tooling
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Before proposing language changes, please read the permanent
        refusals in CONTRIBUTING.md (conditionals, in-draft definitions,
        content analysis, parameterized profiles). Proposals in those
        areas will be declined.
  - type: textarea
    id: problem
    attributes:
      label: The problem this solves
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: For syntax, show a draft using it.
    validations:
      required: true
